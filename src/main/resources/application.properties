spring.application.name=Poker

server.port=${SERVER_PORT}

logging.level.root=INFO
logging.level.com.pokergame=INFO
logging.file.name=${LOG_FILE:/app/logs/poker.log}
logging.logback.rollingpolicy.file-name-pattern=${LOG_FILE:/app/logs/poker.log}.%d{yyyy-MM-dd}.%i.gz
logging.logback.rollingpolicy.max-file-size=20MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=500MB
logging.logback.rollingpolicy.clean-history-on-start=true
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [room=%X{roomId:-} player=%X{playerName:-}] %logger{25} - %msg%n
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [room=%X{roomId:-}] %logger{20} - %msg%n
logging.level.com.pokergame.persistence=${LOG_LEVEL_PERSISTENCE:INFO}
logging.level.com.pokergame.config=${LOG_LEVEL_WEBSOCKET:INFO}

# JWT Configuration
app.jwt.base64-secret=${JWT_SECRET}
jwt.expirationMillis=${JWT_EXPIRATION_MILLIS}

# Security & CORS
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
poker.security.trust-proxy=${TRUST_PROXY}

# Game Timing & Lifecycle (ms)
poker.disconnect.grace-period-ms=${POKER_DISCONNECT_GRACE_PERIOD_MS}
poker.round-end.display-delay-ms=${POKER_ROUND_END_DISPLAY_DELAY_MS}
poker.ready-countdown-ms=${POKER_READY_COUNTDOWN_MS}
poker.game-end.display-delay-ms=${POKER_GAME_END_DISPLAY_DELAY_MS}

# Rate Limiting
poker.rate-limiting.enabled=${POKER_RATE_LIMITING_ENABLED}

# Encrypted per-room recovery
poker.persistence.enabled=${POKER_PERSISTENCE_ENABLED}
poker.persistence.directory=${POKER_PERSISTENCE_DIRECTORY}
poker.persistence.current-key-id=${POKER_PERSISTENCE_CURRENT_KEY_ID}
poker.persistence.keys.current=${POKER_PERSISTENCE_KEY_CURRENT}
poker.persistence.compact-after-records=${POKER_PERSISTENCE_COMPACT_AFTER_RECORDS}
poker.persistence.compact-after-bytes=${POKER_PERSISTENCE_COMPACT_AFTER_BYTES}
