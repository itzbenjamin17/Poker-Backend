spring.application.name=Poker

server.port=${SERVER_PORT}

logging.level.root=INFO
logging.level.com.pokergame=INFO

# JWT Configuration
app.jwt.base64-secret=${JWT_SECRET}
jwt.expirationMillis=${JWT_EXPIRATION_MILLIS}

# Security & CORS
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
poker.security.trust-proxy=${TRUST_PROXY}

# Per-player reconnection window (2 minutes)
poker.disconnect.grace-period-ms=120000

# Delay before ready gate opens after showdown reveal (ms, 0 = immediate)
poker.round-end.display-delay-ms=0

# Shared ready countdown duration (ms)
poker.ready-countdown-ms=30000

# Delay before finished room and game are destroyed (ms)
poker.game-end.display-delay-ms=20000

# Encrypted per-room recovery (enable in deployed environments with a persistent volume)
poker.persistence.enabled=${POKER_PERSISTENCE_ENABLED:false}
poker.persistence.directory=${POKER_PERSISTENCE_DIRECTORY:./data/poker-wal}
poker.persistence.current-key-id=${POKER_PERSISTENCE_CURRENT_KEY_ID:current}
poker.persistence.keys.current=${POKER_PERSISTENCE_KEY_CURRENT:}
poker.persistence.compact-after-records=${POKER_PERSISTENCE_COMPACT_AFTER_RECORDS:1000}
poker.persistence.compact-after-bytes=${POKER_PERSISTENCE_COMPACT_AFTER_BYTES:16777216}

# Rate Limiting
poker.rate-limiting.enabled=true
