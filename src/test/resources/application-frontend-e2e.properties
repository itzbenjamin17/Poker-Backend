# Profile for the frontend's Playwright run. Activate together with `test`:
#   mvnw spring-boot:test-run -Dspring-boot.run.profiles=test,frontend-e2e
# The `test` profile provides the baseline. This file holds only what the frontend relies on.
server.port=8080

# Timings and security toggles the frontend specs depend on. Repeated on purpose, so changes to the test baseline don't break Playwright.
poker.game.round-end-display-delay-ms=0
poker.game.ready-countdown-ms=900
poker.game.game-end-display-delay-ms=500
poker.rate-limiting.enabled=false
poker.persistence.enabled=false
app.security.cors.allowed-origins=http://localhost:5173,http://localhost
